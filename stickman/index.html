<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>纸上小人大战 · 手绘火柴人对战</title>
<style>
  :root {
    --paper: #f6f2e8;
    --paper-dark: #ebe5d6;
    --ink: #1e1c1a;
    --ink-soft: #4e4942;
    --accent: #c94a38;
    --accent-2: #2e6b8a;
    --gold: #c9922c;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #dcd5c6;
    background-image:
      radial-gradient(rgba(30,28,26,0.06) 1px, transparent 1px),
      linear-gradient(135deg, #e2dbcc 0%, #cfc7b6 100%);
    background-size: 18px 18px, 100% 100%;
    color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Kaiti SC", "STKaiti", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  .notebook {
    width: min(1040px, 100%);
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 6px 10px 8px 12px / 10px 6px 12px 8px;
    box-shadow:
      6px 7px 0 rgba(30,28,26,0.22),
      0 14px 36px rgba(30,28,26,0.18);
    padding: 12px 14px 14px;
    position: relative;
  }

  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 2px dashed rgba(30,28,26,0.25);
  }

  .title-group {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .title-group h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 1px;
    font-weight: 800;
  }

  .title-group .subtitle {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .sketch-btn {
    appearance: none;
    background: #fffdf8;
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 6px 9px 7px 10px / 8px 6px 9px 7px;
    padding: 5px 11px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.12s ease;
    font-family: inherit;
  }

  .sketch-btn:hover {
    background: #f5efe0;
  }

  .sketch-btn:active {
    transform: translate(1.5px, 1.5px);
    box-shadow: 0.5px 0.5px 0 var(--ink);
  }

  .sketch-btn.active {
    background: var(--ink);
    color: #fffdf8;
  }

  .sketch-btn.accent {
    background: #fff3d6;
  }

  .gamepad-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    background: #f3eee2;
    border: 2px dashed rgba(30,28,26,0.35);
    border-radius: 999px;
  }

  .gamepad-pill.connected {
    color: #1f5c35;
    background: #e6f4ea;
    border-style: solid;
    border-color: #2c7a47;
  }

  .stage-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 3px solid var(--ink);
    border-radius: 4px 7px 5px 8px / 7px 4px 8px 5px;
    overflow: hidden;
    background: var(--paper);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  .hud-controls {
    margin-top: 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
  }

  .key-guide {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .key-guide strong {
    color: var(--ink);
  }

  kbd {
    display: inline-block;
    padding: 1px 5px;
    font-size: 11.5px;
    font-weight: 700;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #fffdf8;
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    box-shadow: 1px 1px 0 var(--ink);
    margin: 0 1px;
    color: var(--ink);
  }

  .touch-pad {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px;
    padding-top: 8px;
    border-top: 2px dashed rgba(30,28,26,0.2);
  }

  .pad-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .pad-btn {
    min-width: 56px;
    height: 40px;
    padding: 0 10px;
    background: #fffdf8;
    border: 2px solid var(--ink);
    border-radius: 8px 6px 9px 7px / 7px 9px 6px 8px;
    font-size: 13px;
    font-weight: 800;
    color: var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    cursor: pointer;
    font-family: inherit;
    touch-action: none;
  }

  .pad-btn:active, .pad-btn.pressed {
    background: var(--ink);
    color: #fffdf8;
    transform: translate(1.5px, 1.5px);
    box-shadow: 0.5px 0.5px 0 var(--ink);
  }

  .pad-btn.skill-sword { background: #fdece8; }
  .pad-btn.skill-banana { background: #fdf6dc; }
  .pad-btn.skill-orb { background: #e8f3fa; }
  .pad-btn.skill-shield { background: #edf5ea; }
  .pad-btn.skill-fly { background: #f2ecfa; }

  .status-banner {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .story-caption {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    background: rgba(246, 242, 232, 0.94);
    border: 2px solid var(--ink);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 3px 3px 0 rgba(30,28,26,0.25);
    display: none;
    pointer-events: none;
    white-space: nowrap;
  }

  .story-caption.visible {
    display: block;
  }

  @media (max-width: 720px) {
    body { padding: 6px; }
    .notebook { padding: 8px 10px 10px; }
    .title-group h1 { font-size: 16px; }
    .hud-controls { grid-template-columns: 1fr; }
    .pad-btn { min-width: 48px; height: 38px; font-size: 12px; padding: 0 8px; }
  }
</style>
</head>
<body>
  <div class="notebook">
    <div class="topbar">
      <div class="title-group">
        <h1>纸上小人大战</h1>
        <span class="subtitle">根据手绘六格漫画改编 · 会挥剑、丢香蕉皮、放星光波、举盾、飘飞</span>
      </div>
      <div class="toolbar">
        <button class="sketch-btn active" id="btnMode1P">单人打电脑</button>
        <button class="sketch-btn" id="btnMode2P">双人对战</button>
        <button class="sketch-btn" id="btnDiff" title="切换电脑难度">电脑：普通</button>
        <button class="sketch-btn" id="btnSwap" title="互换双方角色">换角色</button>
        <button class="sketch-btn" id="btnTime" title="切换太阳 / 月亮">☀ 白天</button>
        <button class="sketch-btn accent" id="btnStory">▶ 播原画六格</button>
        <button class="sketch-btn" id="btnSound">🔊 音效开</button>
        <button class="sketch-btn" id="btnRestart">↻ 重来</button>
        <span class="gamepad-pill" id="gamepadPill" title="插上或蓝牙连接手柄后，按手柄任意键即可激活">🎮 手柄未连接</span>
      </div>
    </div>

    <div class="stage-wrap">
      <canvas id="game"></canvas>
      <div class="story-caption" id="storyCaption"></div>
    </div>

    <div class="hud-controls">
      <div class="key-guide" id="keyGuide">
        <div>
          <strong>1P（左）：</strong>
          <kbd>A</kbd><kbd>D</kbd> 移动 ·
          <kbd>W</kbd> 跳/按住飞飘 ·
          <kbd>J</kbd> 挥剑 ·
          <kbd>K</kbd> 香蕉皮 ·
          <kbd>L</kbd> 星光波 ·
          <kbd>S</kbd> 圆盾格挡
        </div>
        <div id="p2Guide" style="display:none;">
          <strong>2P（右）：</strong>
          <kbd>←</kbd><kbd>→</kbd> 移动 ·
          <kbd>↑</kbd> 跳/按住飞飘 ·
          <kbd>1</kbd>/<kbd>N</kbd> 挥剑 ·
          <kbd>2</kbd>/<kbd>M</kbd> 香蕉皮 ·
          <kbd>3</kbd>/<kbd>,</kbd> 星光波 ·
          <kbd>↓</kbd> 圆盾格挡
        </div>
        <div>
          <strong>手柄（支持 1P/2P）：</strong>
          左摇杆/十字键 移动 ·
          <kbd>A</kbd>/<kbd>×</kbd>或上 跳/飞飘 ·
          <kbd>X</kbd>/<kbd>□</kbd>/<kbd>RB</kbd> 挥剑 ·
          <kbd>B</kbd>/<kbd>○</kbd> 香蕉皮 ·
          <kbd>Y</kbd>/<kbd>△</kbd>/<kbd>RT</kbd> 星光波 ·
          <kbd>LB</kbd>/<kbd>LT</kbd>/下 举盾 ·
          <kbd>Start</kbd> 重来
        </div>
      </div>
      <div style="font-size:12px; color:var(--ink-soft);">快捷键：<kbd>R</kbd> / <kbd>Start</kbd> 重开</div>
    </div>

    <div class="touch-pad" aria-label="触控操作按钮">
      <div class="pad-group">
        <button class="pad-btn" data-action="left">← 左移</button>
        <button class="pad-btn" data-action="right">右移 →</button>
        <button class="pad-btn skill-fly" data-action="up">↑ 跳 / 飞飘</button>
        <button class="pad-btn skill-shield" data-action="down">🛡 举盾</button>
      </div>
      <div class="pad-group">
        <button class="pad-btn skill-sword" data-action="sword">⚔ 挥剑</button>
        <button class="pad-btn skill-banana" data-action="banana">🍌 香蕉皮</button>
        <button class="pad-btn skill-orb" data-action="orb">✦ 星光波</button>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  // =========================================================
  // 1. Canvas & Logical Resolution Setup
  // =========================================================
  const W = 960;
  const H = 540;
  const GROUND_Y = 448;
  const CEILING_Y = 66;
  const STAGE_LEFT = 46;
  const STAGE_RIGHT = W - 46;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const storyCaption = document.getElementById('storyCaption');

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Pre-render subtle paper grain texture onto an offscreen canvas
  const paperTex = document.createElement('canvas');
  paperTex.width = W;
  paperTex.height = H;
  {
    const pctx = paperTex.getContext('2d');
    pctx.fillStyle = '#f6f2e8';
    pctx.fillRect(0, 0, W, H);
    // Gentle paper speckles & fibers
    let s = 1337;
    const rand = () => {
      s = (s * 16807) % 2147483647;
      return (s - 1) / 2147483646;
    };
    for (let i = 0; i < 2400; i++) {
      const x = rand() * W;
      const y = rand() * H;
      const a = rand() * 0.04;
      pctx.fillStyle = rand() > 0.5 ? `rgba(60,50,35,${a})` : `rgba(255,255,255,${a * 1.4})`;
      pctx.fillRect(x, y, rand() * 2.2 + 0.5, rand() * 2.2 + 0.5);
    }
    // Very faint fold crease in center like folded comic paper
    const grad = pctx.createLinearGradient(W * 0.48, 0, W * 0.52, 0);
    grad.addColorStop(0, 'rgba(30,28,26,0)');
    grad.addColorStop(0.5, 'rgba(30,28,26,0.035)');
    grad.addColorStop(1, 'rgba(30,28,26,0)');
    pctx.fillStyle = grad;
    pctx.fillRect(W * 0.48, 0, W * 0.04, H);
  }

  // =========================================================
  // 2. Web Audio Synthesizer (Zero External Assets)
  // =========================================================
  let audioCtx = null;
  let soundEnabled = true;

  function ensureAudio() {
    if (!soundEnabled) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  const SFX = {
    sword() {
      const ac = ensureAudio(); if (!ac) return;
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.12);
      gain.gain.setValueAtTime(0.11, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      osc.connect(gain).connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.14);
    },
    hit() {
      const ac = ensureAudio(); if (!ac) return;
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.13);
      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(gain).connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    },
    block() {
      const ac = ensureAudio(); if (!ac) return;
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(660, now);
      osc.frequency.exponentialRampToValueAtTime(980, now + 0.08);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain).connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    },
    bananaThrow() {
      const ac = ensureAudio(); if (!ac) return;
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(640, now + 0.11);
      gain.gain.setValueAtTime(0.10, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(gain).connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    },
    slip() {
      const ac = ensureAudio(); if (!ac) return;
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(1250, now + 0.16);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.34);
      gain.gain.setValueAtTime(0.16, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
      osc.connect(gain).connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.37);
    },
    orb() {
      const ac = ensureAudio(); if (!ac) return;
      const now = ac.currentTime;
      [680, 960, 1280].forEach((f, idx) => {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now + idx * 0.03);
        osc.frequency.exponentialRampToValueAtTime(f * 1.25, now + idx * 0.03 + 0.12);
        gain.gain.setValueAtTime(0.06, now + idx * 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.03 + 0.14);
        osc.connect(gain).connect(ac.destination);
        osc.start(now + idx * 0.03);
        osc.stop(now + idx * 0.03 + 0.15);
      });
    },
    jump() {
      const ac = ensureAudio(); if (!ac) return;
      const now = ac.currentTime;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(480, now + 0.09);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
      osc.connect(gain).connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.11);
    },
    ko() {
      const ac = ensureAudio(); if (!ac) return;
      const now = ac.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + i * 0.09);
        gain.gain.setValueAtTime(0.11, now + i * 0.09);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.28);
        osc.connect(gain).connect(ac.destination);
        osc.start(now + i * 0.09);
        osc.stop(now + i * 0.09 + 0.3);
      });
    }
  };

  // =========================================================
  // 3. Hand-Drawn Sketch Primitives (8fps line boil!)
  // =========================================================
  let globalTime = 0;
  function boilSeed(id) {
    const f = Math.floor(globalTime * 8);
    return ((id * 73856093) ^ (f * 19349663)) >>> 0;
  }
  function hashFloat(seed) {
    let x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  }
  function jitter(seed, amp) {
    return (hashFloat(seed) - 0.5) * 2 * amp;
  }

  function sketchLine(x1, y1, x2, y2, width = 3, color = '#1e1c1a', seed = 1, wob = 1.4) {
    const mx = (x1 + x2) * 0.5 + jitter(seed + 1, wob);
    const my = (y1 + y2) * 0.5 + jitter(seed + 2, wob);
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x1 + jitter(seed + 3, wob * 0.4), y1 + jitter(seed + 4, wob * 0.4));
    ctx.quadraticCurveTo(mx, my, x2 + jitter(seed + 5, wob * 0.4), y2 + jitter(seed + 6, wob * 0.4));
    ctx.stroke();
    ctx.restore();
  }

  function sketchCircle(cx, cy, r, width = 3, color = '#1e1c1a', fill = null, seed = 10, wob = 1.1) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    const steps = 18;
    for (let i = 0; i <= steps; i++) {
      const a = (i / steps) * Math.PI * 2;
      const rr = r + jitter(seed + i * 3, wob);
      const px = cx + Math.cos(a) * rr;
      const py = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    if (fill) {
      ctx.fillStyle = fill;
      ctx.fill();
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawCurvedPointer(fromX, fromY, toX, toY, seed = 77) {
    const cx = (fromX + toX) * 0.5 + (fromY - toY) * 0.22;
    const cy = (fromY + toY) * 0.5 + (toX - fromX) * 0.14;
    ctx.save();
    ctx.strokeStyle = '#1e1c1a';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(fromX, fromY);
    ctx.quadraticCurveTo(cx + jitter(seed, 1.5), cy + jitter(seed + 1, 1.5), toX, toY);
    ctx.stroke();
    // Arrowhead
    const ang = Math.atan2(toY - cy, toX - cx);
    ctx.beginPath();
    ctx.moveTo(toX, toY);
    ctx.lineTo(toX - Math.cos(ang - 0.55) * 9, toY - Math.sin(ang - 0.55) * 9);
    ctx.moveTo(toX, toY);
    ctx.lineTo(toX - Math.cos(ang + 0.55) * 9, toY - Math.sin(ang + 0.55) * 9);
    ctx.stroke();
    ctx.restore();
  }

  // =========================================================
  // 4. Comic World Scenery (Sun, Moon, 这是天, 这是地)
  // =========================================================
  let timeMode = 'auto'; // 'auto' | 'day' | 'night'
  let skyNightFactor = 0; // 0 = day (Sun), 1 = night (Moon)

  function isCurrentlyNight() {
    if (timeMode === 'day') return false;
    if (timeMode === 'night') return true;
    if (storyState.active) return storyState.panel >= 5;
    return fighters.some(f => f.hp <= f.maxHp * 0.5);
  }

  function drawSun(x, y, alpha) {
    if (alpha <= 0.01) return;
    const s = boilSeed(101);
    ctx.save();
    ctx.globalAlpha = alpha;
    sketchCircle(x, y, 25, 2.8, '#1e1c1a', '#f6f2e8', s, 1.2);
    const rays = 8;
    for (let i = 0; i < rays; i++) {
      const a = (i / rays) * Math.PI * 2 + globalTime * 0.12;
      const r1 = 33 + jitter(s + i * 5, 2.5);
      const r2 = 51 + jitter(s + i * 7, 5);
      sketchLine(
        x + Math.cos(a) * r1, y + Math.sin(a) * r1,
        x + Math.cos(a) * r2, y + Math.sin(a) * r2,
        2.5, '#1e1c1a', s + i * 11, 1.0
      );
    }
    ctx.restore();
  }

  function drawMoon(x, y, alpha) {
    if (alpha <= 0.01) return;
    const s = boilSeed(202);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.strokeStyle = '#1e1c1a';
    ctx.fillStyle = '#fff9de';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    // Hand-drawn crescent moon matching Panels 5 & 6
    ctx.moveTo(-12 + jitter(s, 1), -34 + jitter(s + 1, 1));
    ctx.bezierCurveTo(28, -32, 34, 24, -10 + jitter(s + 2, 1), 36 + jitter(s + 3, 1));
    ctx.bezierCurveTo(10, 14, 10, -14, -12 + jitter(s, 1), -34 + jitter(s + 1, 1));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawStage() {
    ctx.drawImage(paperTex, 0, 0);

    // Subtle night tint overlay when Moon is out
    if (skyNightFactor > 0.01) {
      ctx.fillStyle = `rgba(38, 48, 72, ${skyNightFactor * 0.10})`;
      ctx.fillRect(0, 0, W, GROUND_Y);
    }

    const s = boilSeed(303);

    // Hand-drawn comic border inside canvas
    sketchLine(10, 10, W - 10, 10, 2.2, 'rgba(30,28,26,0.35)', s + 1, 1.2);
    sketchLine(W - 10, 10, W - 10, H - 10, 2.2, 'rgba(30,28,26,0.35)', s + 2, 1.2);
    sketchLine(W - 10, H - 10, 10, H - 10, 2.2, 'rgba(30,28,26,0.35)', s + 3, 1.2);
    sketchLine(10, H - 10, 10, 10, 2.2, 'rgba(30,28,26,0.35)', s + 4, 1.2);

    // Sun / Moon in upper-right sky (clear of the HUD bars)
    drawSun(W - 108, 140, 1 - skyNightFactor);
    drawMoon(W - 104, 142, skyNightFactor);

    // Ground strip & hand-drawn ink line
    ctx.fillStyle = 'rgba(30,28,26,0.035)';
    ctx.fillRect(14, GROUND_Y, W - 28, H - GROUND_Y - 14);
    sketchLine(14, GROUND_Y, W - 14, GROUND_Y, 3.6, '#1e1c1a', s + 10, 1.8);
    // Double ground accent line like Panel 5
    sketchLine(14, GROUND_Y + 42, W - 14, GROUND_Y + 42, 2.2, 'rgba(30,28,26,0.55)', s + 12, 1.5);

    // Panel 5 signature handwritten annotations: "这是天 ↑" and "→ 这是地"
    ctx.save();
    ctx.fillStyle = 'rgba(30,28,26,0.72)';
    ctx.font = 'bold 20px "Kaiti SC", "STKaiti", "PingFang SC", cursive';
    // Vertical "这是天" on the left with upward arrow
    ctx.fillText('这', 28, 224);
    ctx.fillText('是', 28, 248);
    ctx.fillText('天', 28, 272);
    sketchLine(37, 434, 37, 290, 2.2, 'rgba(30,28,26,0.68)', s + 20, 1.0);
    sketchLine(37, 290, 30, 304, 2.2, 'rgba(30,28,26,0.68)', s + 21, 0.7);
    sketchLine(37, 290, 44, 304, 2.2, 'rgba(30,28,26,0.68)', s + 22, 0.7);

    // "→ 这是地" at bottom right
    ctx.fillText('这是地', W - 110, GROUND_Y + 32);
    drawCurvedPointer(W - 156, GROUND_Y + 34, W - 116, GROUND_Y + 24, s + 30);
    ctx.restore();
  }

  // =========================================================
  // 5. Entities: Fighter, BananaPeel, EnergyOrb, Particle, Callout
  // =========================================================
  const bananaPeels = [];
  const energyOrbs = [];
  const particles = [];
  const callouts = [];

  function spawnSparkles(x, y, count = 8, style = 'diamond') {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 70 + Math.random() * 190;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 30,
        life: 0.25 + Math.random() * 0.28,
        maxLife: 0.53,
        size: 4 + Math.random() * 6,
        style,
        rot: Math.random() * Math.PI
      });
    }
  }

  function spawnCallout(text, x, y, targetX, targetY, duration = 0.95) {
    const cx = Math.max(96, Math.min(W - 96, x));
    const cy = Math.max(82, y);
    callouts.push({ text, x: cx, y: cy, targetX, targetY, life: duration, maxLife: duration });
  }

  function createFighter(id, role, startX, facing) {
    // role: 'ren' ("人"字香蕉剑客, Panel 1/2/5) or 'angry' ("💢"怒气大剑客, Panel 3/4/5/6)
    return {
      id,
      role,
      name: role === 'angry' ? '怒气大剑客' : '「人」字剑客',
      x: startX,
      y: GROUND_Y,
      vx: 0,
      vy: 0,
      facing, // 1 right, -1 left
      hp: 100,
      maxHp: 100,
      flyEnergy: 100,
      maxFlyEnergy: 100,
      onGround: true,
      flying: false,
      state: 'idle', // idle, run, jump, fly, slash, throw, orb, shield, slip, hurt, ko, walkoff
      stateTimer: 0,
      slashHitDone: false,
      shieldTime: 0,
      invuln: 0,
      cooldowns: {
        slash: 0,
        banana: 0,
        orb: 0
      },
      walkPhase: 0,
      slipRot: 0,
      aiTimer: 0.35,
      aiIntent: 'approach',
      combo: 0
    };
  }

  let swapped = false;
  let fighters = [];
  let gameMode = '1p'; // '1p' | '2p'
  let aiDifficulty = 1; // 0 easy, 1 normal, 2 hard
  let hitstop = 0;
  let shakeTime = 0;
  let shakeAmp = 0;
  let matchState = 'fighting'; // 'fighting' | 'ko'
  let winnerId = null;
  let koTimer = 0;

  function resetMatch() {
    bananaPeels.length = 0;
    energyOrbs.length = 0;
    particles.length = 0;
    callouts.length = 0;
    hitstop = 0;
    shakeTime = 0;
    matchState = 'fighting';
    winnerId = null;
    koTimer = 0;

    const p1Role = swapped ? 'ren' : 'angry';
    const p2Role = swapped ? 'angry' : 'ren';
    fighters = [
      createFighter(0, p1Role, 250, 1),
      createFighter(1, p2Role, W - 250, -1)
    ];
  }

  // =========================================================
  // 6. Combat Actions (All directly inspired by the 6 panels)
  // =========================================================
  function triggerShake(amp, dur) {
    shakeAmp = Math.max(shakeAmp, amp);
    shakeTime = Math.max(shakeTime, dur);
  }

  function startSlash(f) {
    if (f.cooldowns.slash > 0) return;
    if (['slip', 'hurt', 'ko', 'walkoff'].includes(f.state)) return;
    f.state = 'slash';
    f.stateTimer = 0.28;
    f.slashHitDone = false;
    f.cooldowns.slash = 0.38;
    f.vx += f.facing * 95;
    SFX.sword();
  }

  function startBanana(f) {
    if (f.cooldowns.banana > 0) return;
    if (['slip', 'hurt', 'ko', 'walkoff'].includes(f.state)) return;
    // Limit 2 active peels per owner
    const mine = bananaPeels.filter(b => b.owner === f.id);
    if (mine.length >= 2) {
      const oldestIdx = bananaPeels.indexOf(mine[0]);
      if (oldestIdx >= 0) bananaPeels.splice(oldestIdx, 1);
    }
    f.state = 'throw';
    f.stateTimer = 0.22;
    f.cooldowns.banana = 1.65;
    bananaPeels.push({
      owner: f.id,
      x: f.x + f.facing * 26,
      y: f.y - 54,
      vx: f.facing * 290,
      vy: -240,
      landed: false,
      life: 11,
      rot: 0,
      armDelay: 0.16
    });
    SFX.bananaThrow();
  }

  function startOrb(f) {
    if (f.cooldowns.orb > 0) return;
    if (['slip', 'hurt', 'ko', 'walkoff'].includes(f.state)) return;
    f.state = 'orb';
    f.stateTimer = 0.30;
    f.cooldowns.orb = 1.25;
    energyOrbs.push({
      owner: f.id,
      x: f.x + f.facing * 42,
      y: f.y - 52,
      vx: f.facing * 430,
      vy: 0,
      r: 17,
      life: 2.2,
      rot: 0
    });
    spawnSparkles(f.x + f.facing * 36, f.y - 52, 7, 'diamond');
    SFX.orb();
  }

  function damageFighter(attacker, defender, amount, knockX, knockY, isProjectile = false) {
    if (defender.state === 'ko' || matchState === 'ko') return false;

    // Check Shield Block (Panel 4)
    if (defender.state === 'shield') {
      const reduced = Math.max(1, Math.round(amount * 0.15));
      defender.hp = Math.max(1, defender.hp - reduced);
      defender.vx += Math.sign(knockX) * 110;
      spawnSparkles(defender.x + defender.facing * 20, defender.y - 50, 8, 'dot');
      spawnCallout('挡!', defender.x, defender.y - 115, defender.x, defender.y - 78, 0.55);
      SFX.block();
      rumbleGamepad(defender.id, 70, 0.25, 0.15);
      hitstop = 0.04;
      triggerShake(3, 0.10);
      return 'blocked';
    }

    defender.hp = Math.max(0, defender.hp - amount);
    defender.vx = knockX;
    defender.vy = knockY;
    defender.onGround = false;
    defender.flying = false;
    spawnSparkles(defender.x, defender.y - 50, 10, 'diamond');
    SFX.hit();
    rumbleGamepad(defender.id, 120, 0.55, 0.35);
    if (attacker) rumbleGamepad(attacker.id, 70, 0.2, 0.15);
    hitstop = 0.055;
    triggerShake(6.5, 0.16);

    if (defender.hp <= 0) {
      triggerKO(attacker, defender);
    } else {
      defender.state = 'hurt';
      defender.stateTimer = 0.24;
    }
    return 'hit';
  }

  function triggerSlip(victim, peel) {
    if (victim.state === 'ko' || matchState === 'ko') return;
    victim.state = 'slip';
    victim.stateTimer = 0.85;
    victim.slipRot = 0;
    victim.onGround = false;
    victim.flying = false;
    victim.vy = -440;
    victim.vx = (victim.x >= peel.x ? 1 : -1) * 165;
    victim.hp = Math.max(1, victim.hp - 7); // Banana slips leave 1HP or chip damage so sword/orb finishes cleanly
    spawnSparkles(peel.x, GROUND_Y - 10, 7, 'dot');
    spawnCallout('滑倒!', victim.x + 28, victim.y - 118, victim.x, victim.y - 65, 0.8);
    SFX.slip();
    rumbleGamepad(victim.id, 180, 0.45, 0.6);
    triggerShake(5, 0.14);
  }

  function triggerKO(winner, loser) {
    matchState = 'ko';
    winnerId = winner ? winner.id : null;
    koTimer = 0;
    loser.state = 'ko';
    loser.hp = 0;
    loser.vx = (loser.x >= (winner ? winner.x : W * 0.5) ? 1 : -1) * 260;
    loser.vy = -220;
    loser.onGround = false;

    if (winner) {
      winner.state = 'walkoff';
      winner.stateTimer = 99;
      winner.flying = false;
      // Winner faces away from loser like Panel 6 ("走了")
      winner.facing = winner.x >= loser.x ? 1 : -1;
      spawnCallout('走了', winner.x - winner.facing * 26, winner.y - 142, winner.x, winner.y - 98, 5.0);
    }
    hitstop = 0.14;
    triggerShake(10, 0.28);
    rumbleGamepad(loser.id, 280, 0.8, 0.6);
    if (winner) rumbleGamepad(winner.id, 160, 0.35, 0.35);
    SFX.ko();
  }

  // =========================================================
  // 7. Input Handling (Keyboard + Touch Buttons + Gamepad API)
  // =========================================================
  const keys = new Set();
  const justPressed = new Set();
  const touchState = {
    left: false, right: false, up: false, down: false,
    sword: false, banana: false, orb: false
  };
  const touchJustPressed = new Set();

  // Standard Gamepad Support (Xbox / PS / Switch Pro / 8BitDo / Generic)
  const gamepadPill = document.getElementById('gamepadPill');
  const gpPrev = [
    { up: false, sword: false, banana: false, orb: false, start: false },
    { up: false, sword: false, banana: false, orb: false, start: false }
  ];
  let activeGamepads = [null, null]; // slot 0 -> 1P, slot 1 -> 2P
  let lastGpCount = -1;

  function btnPressed(gp, idx) {
    const b = gp && gp.buttons && gp.buttons[idx];
    return !!(b && (b.pressed || b.value > 0.45));
  }

  function rumbleGamepad(playerIdx, duration = 100, strong = 0.4, weak = 0.2) {
    const gp = activeGamepads[playerIdx];
    if (!gp) return;
    try {
      const act = gp.vibrationActuator;
      if (act && typeof act.playEffect === 'function') {
        act.playEffect('dual-rumble', {
          startDelay: 0,
          duration,
          strongMagnitude: strong,
          weakMagnitude: weak
        }).catch(() => {});
      }
    } catch (_) {}
  }

  function pollGamepads() {
    if (!navigator.getGamepads) return;
    const raw = navigator.getGamepads();
    const list = [];
    for (let i = 0; i < raw.length; i++) {
      if (raw[i] && raw[i].connected) list.push(raw[i]);
    }
    activeGamepads[0] = list[0] || null;
    activeGamepads[1] = list[1] || null;

    if (list.length !== lastGpCount) {
      lastGpCount = list.length;
      if (list.length === 0) {
        gamepadPill.textContent = '🎮 手柄未连接';
        gamepadPill.classList.remove('connected');
      } else if (list.length === 1) {
        gamepadPill.textContent = '🎮 已连 1P 手柄';
        gamepadPill.classList.add('connected');
      } else {
        gamepadPill.textContent = '🎮 已连 1P + 2P 手柄';
        gamepadPill.classList.add('connected');
        // Auto-enable 2P mode when a second controller is connected
        if (gameMode !== '2p' && typeof setMode2P === 'function') {
          setMode2P();
        }
      }
    }
  }

  window.addEventListener('gamepadconnected', () => {
    pollGamepads();
    ensureAudio();
  });
  window.addEventListener('gamepaddisconnected', pollGamepads);

  function readGamepadSlot(slotIdx) {
    const gp = activeGamepads[slotIdx];
    const prev = gpPrev[slotIdx];
    if (!gp) {
      prev.up = prev.sword = prev.banana = prev.orb = prev.start = false;
      return {
        left: false, right: false, up: false, upPressed: false,
        down: false, sword: false, banana: false, orb: false, startPressed: false
      };
    }

    const ax = (gp.axes && gp.axes.length > 0) ? gp.axes[0] : 0;
    const ay = (gp.axes && gp.axes.length > 1) ? gp.axes[1] : 0;

    // Movement: Left Stick or D-Pad
    const left = ax < -0.28 || btnPressed(gp, 14);
    const right = ax > 0.28 || btnPressed(gp, 15);

    // Jump / Fly: A (0), D-Pad Up (12), or Left Stick Up
    const up = btnPressed(gp, 0) || btnPressed(gp, 12) || ay < -0.45;
    // Shield: LB (4), LT (6), D-Pad Down (13), or Left Stick Down
    const down = btnPressed(gp, 4) || btnPressed(gp, 6) || btnPressed(gp, 13) || ay > 0.45;
    // Sword: X (2) or RB (5)
    const swordNow = btnPressed(gp, 2) || btnPressed(gp, 5);
    // Banana Peel: B (1)
    const bananaNow = btnPressed(gp, 1);
    // Sparkle Energy Orb: Y (3) or RT (7)
    const orbNow = btnPressed(gp, 3) || btnPressed(gp, 7);
    // Restart: Start / Options / + (9)
    const startNow = btnPressed(gp, 9);

    const res = {
      left,
      right,
      up,
      upPressed: up && !prev.up,
      down,
      sword: swordNow && !prev.sword,
      banana: bananaNow && !prev.banana,
      orb: orbNow && !prev.orb,
      startPressed: startNow && !prev.start
    };

    prev.up = up;
    prev.sword = swordNow;
    prev.banana = bananaNow;
    prev.orb = orbNow;
    prev.start = startNow;

    if (res.upPressed || res.sword || res.banana || res.orb || res.startPressed) {
      ensureAudio();
    }
    return res;
  }

  window.addEventListener('keydown', (e) => {
    const code = e.code;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) {
      e.preventDefault();
    }
    if (!keys.has(code)) {
      justPressed.add(code);
    }
    keys.add(code);
    if (code === 'KeyR' && !storyState.active) {
      resetMatch();
    }
  });

  window.addEventListener('keyup', (e) => {
    keys.delete(e.code);
  });

  window.addEventListener('blur', () => {
    keys.clear();
    Object.keys(touchState).forEach(k => touchState[k] = false);
  });

  document.querySelectorAll('.pad-btn').forEach(btn => {
    const act = btn.dataset.action;
    const press = (e) => {
      e.preventDefault();
      ensureAudio();
      if (!touchState[act]) touchJustPressed.add(act);
      touchState[act] = true;
      btn.classList.add('pressed');
    };
    const release = (e) => {
      e.preventDefault();
      touchState[act] = false;
      btn.classList.remove('pressed');
    };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('pointercancel', release);
  });

  function readHumanInput(playerIdx) {
    const gp = readGamepadSlot(playerIdx);
    if (gp.startPressed && !storyState.active) {
      resetMatch();
    }

    if (playerIdx === 0) {
      const singlePArrows = gameMode === '1p';
      return {
        left: keys.has('KeyA') || touchState.left || (singlePArrows && keys.has('ArrowLeft')) || gp.left,
        right: keys.has('KeyD') || touchState.right || (singlePArrows && keys.has('ArrowRight')) || gp.right,
        up: keys.has('KeyW') || keys.has('Space') || touchState.up || (singlePArrows && keys.has('ArrowUp')) || gp.up,
        upPressed: justPressed.has('KeyW') || justPressed.has('Space') || touchJustPressed.has('up') || (singlePArrows && justPressed.has('ArrowUp')) || gp.upPressed,
        down: keys.has('KeyS') || touchState.down || (singlePArrows && keys.has('ArrowDown')) || gp.down,
        sword: justPressed.has('KeyJ') || touchJustPressed.has('sword') || gp.sword,
        banana: justPressed.has('KeyK') || touchJustPressed.has('banana') || gp.banana,
        orb: justPressed.has('KeyL') || touchJustPressed.has('orb') || gp.orb
      };
    } else {
      return {
        left: keys.has('ArrowLeft') || gp.left,
        right: keys.has('ArrowRight') || gp.right,
        up: keys.has('ArrowUp') || gp.up,
        upPressed: justPressed.has('ArrowUp') || gp.upPressed,
        down: keys.has('ArrowDown') || gp.down,
        sword: justPressed.has('Digit1') || justPressed.has('Numpad1') || justPressed.has('KeyN') || gp.sword,
        banana: justPressed.has('Digit2') || justPressed.has('Numpad2') || justPressed.has('KeyM') || gp.banana,
        orb: justPressed.has('Digit3') || justPressed.has('Numpad3') || justPressed.has('Comma') || gp.orb
      };
    }
  }

  // =========================================================
  // 8. Playful Comic AI
  // =========================================================
  function computeAIInput(f, enemy, dt) {
    const inp = { left: false, right: false, up: false, upPressed: false, down: false, sword: false, banana: false, orb: false };
    if (matchState !== 'fighting') return inp;

    const dx = enemy.x - f.x;
    const dist = Math.abs(dx);
    const dir = dx >= 0 ? 1 : -1;

    // React to incoming enemy orbs
    const incomingOrb = energyOrbs.find(o => o.owner !== f.id && Math.abs(o.x - f.x) < 150 && Math.sign(o.vx) === Math.sign(f.x - o.x));
    const reactChance = [0.35, 0.68, 0.92][aiDifficulty];
    if (incomingOrb && Math.abs(incomingOrb.y - (f.y - 50)) < 55) {
      if (Math.random() < reactChance) {
        if (Math.random() < 0.6) inp.down = true;
        else { inp.up = true; inp.upPressed = true; }
        return inp;
      }
    }

    // Avoid banana peel right in front of feet
    const nearbyPeel = bananaPeels.find(p => p.landed && p.owner !== f.id && Math.abs(p.x - f.x) < 62);
    if (nearbyPeel && f.onGround && Math.random() < reactChance) {
      inp.up = true;
      inp.upPressed = true;
    }

    f.aiTimer -= dt;
    const thinkRate = [0.42, 0.24, 0.13][aiDifficulty];
    if (f.aiTimer <= 0) {
      f.aiTimer = thinkRate + Math.random() * 0.18;
      const r = Math.random();
      if (dist < 105) {
        if (enemy.state === 'slash' && r < 0.48) f.aiIntent = 'shield';
        else if (r < 0.65) f.aiIntent = 'slash';
        else if (r < 0.85) f.aiIntent = 'retreat';
        else f.aiIntent = 'fly_attack';
      } else if (dist < 280) {
        if (r < 0.36) f.aiIntent = 'approach';
        else if (r < 0.62) f.aiIntent = 'banana';
        else if (r < 0.85) f.aiIntent = 'orb';
        else f.aiIntent = 'fly_attack';
      } else {
        if (r < 0.45) f.aiIntent = 'approach';
        else if (r < 0.78) f.aiIntent = 'orb';
        else f.aiIntent = 'fly_attack';
      }
    }

    switch (f.aiIntent) {
      case 'approach':
        if (dir < 0) inp.left = true; else inp.right = true;
        if (dist < 95 && Math.random() < 0.15) inp.sword = true;
        break;
      case 'retreat':
        if (dir < 0) inp.right = true; else inp.left = true;
        if (f.cooldowns.banana <= 0 && Math.random() < 0.12) inp.banana = true;
        break;
      case 'slash':
        if (dir < 0) inp.left = true; else inp.right = true;
        if (dist < 96) inp.sword = true;
        break;
      case 'banana':
        f.facing = dir;
        if (f.cooldowns.banana <= 0) {
          inp.banana = true;
          f.aiIntent = 'retreat';
        } else {
          if (dir < 0) inp.left = true; else inp.right = true;
        }
        break;
      case 'orb':
        f.facing = dir;
        if (f.cooldowns.orb <= 0) {
          inp.orb = true;
          f.aiIntent = 'approach';
        } else {
          if (dir < 0) inp.left = true; else inp.right = true;
        }
        break;
      case 'shield':
        inp.down = true;
        break;
      case 'fly_attack':
        if (f.flyEnergy > 25) {
          inp.up = true;
          if (f.onGround) inp.upPressed = true;
        }
        if (dir < 0) inp.left = true; else inp.right = true;
        if (dist < 115 && Math.random() < 0.14) inp.sword = true;
        else if (dist > 160 && f.cooldowns.orb <= 0 && Math.random() < 0.08) inp.orb = true;
        break;
    }
    return inp;
  }

  // =========================================================
  // 9. Physics & Update Loop
  // =========================================================
  function updateFighter(f, enemy, inp, dt) {
    f.cooldowns.slash = Math.max(0, f.cooldowns.slash - dt);
    f.cooldowns.banana = Math.max(0, f.cooldowns.banana - dt);
    f.cooldowns.orb = Math.max(0, f.cooldowns.orb - dt);
    f.invuln = Math.max(0, f.invuln - dt);

    if (f.state === 'ko') {
      f.vy += 1250 * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.y >= GROUND_Y) {
        f.y = GROUND_Y;
        f.vy = 0;
        f.vx *= Math.pow(0.06, dt);
        f.onGround = true;
      }
      f.x = Math.max(STAGE_LEFT + 18, Math.min(STAGE_RIGHT - 18, f.x));
      return;
    }

    if (f.state === 'walkoff') {
      // Panel 6 victory walk ("走了")
      f.vy += 1250 * dt;
      f.y = Math.min(GROUND_Y, f.y + f.vy * dt);
      if (f.y >= GROUND_Y) {
        f.onGround = true;
        f.vy = 0;
        if (koTimer > 0.65 && f.x > STAGE_LEFT + 70 && f.x < STAGE_RIGHT - 70) {
          f.x += f.facing * 75 * dt;
          f.walkPhase += dt * 7;
        }
      }
      return;
    }

    // Active timer states
    if (['slash', 'throw', 'orb', 'hurt', 'slip'].includes(f.state)) {
      f.stateTimer -= dt;
      if (f.state === 'slip') {
        f.slipRot += dt * 11 * (f.vx >= 0 ? 1 : -1);
      }
      // Slash hit window
      if (f.state === 'slash' && !f.slashHitDone && f.stateTimer < 0.21 && f.stateTimer > 0.08) {
        const reachX = f.x + f.facing * 54;
        const reachY = f.y - 48;
        if (Math.abs(enemy.x - reachX) < 58 && Math.abs((enemy.y - 48) - reachY) < 62) {
          f.slashHitDone = true;
          damageFighter(f, enemy, 14, f.facing * 240, -175, false);
        }
      }
      if (f.stateTimer <= 0) {
        f.state = f.onGround ? 'idle' : 'jump';
        f.slipRot = 0;
      }
    }

    const locked = ['slash', 'throw', 'orb', 'hurt', 'slip'].includes(f.state);

    if (!locked) {
      // Attacks
      if (inp.sword) {
        startSlash(f);
      } else if (inp.banana) {
        startBanana(f);
      } else if (inp.orb) {
        startOrb(f);
      } else if (inp.down) {
        // Shield block (Panel 4)
        f.state = 'shield';
        f.shieldTime += dt;
        f.vx *= Math.pow(0.01, dt);
        f.flying = false;
      } else {
        f.shieldTime = 0;
        // Horizontal movement
        const moveSpeed = f.flying ? 275 : 255;
        let moveDir = 0;
        if (inp.left) moveDir -= 1;
        if (inp.right) moveDir += 1;
        if (moveDir !== 0) {
          f.facing = moveDir;
          f.vx = moveDir * moveSpeed;
          if (f.onGround) {
            f.state = 'run';
            f.walkPhase += dt * 12;
          }
        } else {
          f.vx *= Math.pow(0.001, dt);
          if (Math.abs(f.vx) < 8) f.vx = 0;
          if (f.onGround) f.state = 'idle';
        }

        // Jump & Fly/Float ("飞 / 飘", Panel 5)
        if (inp.upPressed && f.onGround) {
          f.vy = -510;
          f.onGround = false;
          f.state = 'jump';
          SFX.jump();
        } else if (inp.up && !f.onGround && f.flyEnergy > 2) {
          // Hold jump in air to hover / fly!
          if (!f.flying && f.vy > -120) {
            f.flying = true;
            const word = Math.random() < 0.5 ? '飞' : '飘';
            spawnCallout(word, f.x - f.facing * 30, f.y - 122, f.x, f.y - 86, 0.75);
          }
          if (f.flying) {
            f.state = 'fly';
            f.flyEnergy = Math.max(0, f.flyEnergy - 32 * dt);
            // Smooth upward / hover thrust
            const targetVy = -140;
            f.vy += (targetVy - f.vy) * Math.min(1, dt * 8);
            if (f.y < CEILING_Y + 60) {
              f.vy = Math.max(0, f.vy);
            }
          }
        } else {
          f.flying = false;
          if (!f.onGround) f.state = 'jump';
        }
      }
    }

    // Gravity
    const grav = f.flying ? 120 : 1280;
    f.vy += grav * dt;

    // Friction in air/hurt/slip
    if (locked) {
      f.vx *= Math.pow(0.25, dt);
    }

    // Integrate position
    f.x += f.vx * dt;
    f.y += f.vy * dt;

    // Bounds
    if (f.y >= GROUND_Y) {
      f.y = GROUND_Y;
      f.vy = 0;
      f.onGround = true;
      f.flying = false;
      f.flyEnergy = Math.min(f.maxFlyEnergy, f.flyEnergy + 46 * dt);
    } else {
      f.onGround = false;
    }

    if (f.y < CEILING_Y + 45) {
      f.y = CEILING_Y + 45;
      if (f.vy < 0) f.vy = 0;
    }
    if (f.x < STAGE_LEFT) { f.x = STAGE_LEFT; f.vx = 0; }
    if (f.x > STAGE_RIGHT) { f.x = STAGE_RIGHT; f.vx = 0; }
  }

  function updateProjectiles(dt) {
    // Banana peels (Panel 1 & 2)
    for (let i = bananaPeels.length - 1; i >= 0; i--) {
      const b = bananaPeels[i];
      b.life -= dt;
      b.armDelay = Math.max(0, b.armDelay - dt);
      if (!b.landed) {
        b.vy += 980 * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.rot += dt * 9;
        if (b.y >= GROUND_Y - 5) {
          b.y = GROUND_Y - 5;
          b.vx = 0;
          b.vy = 0;
          b.rot = 0;
          b.landed = true;
        }
      }
      if (b.x < STAGE_LEFT || b.x > STAGE_RIGHT || b.life <= 0) {
        bananaPeels.splice(i, 1);
        continue;
      }

      // Check slip collision with enemy fighter
      if (b.armDelay <= 0 && matchState === 'fighting') {
        const target = fighters[1 - b.owner];
        if (target && target.state !== 'slip' && target.state !== 'ko') {
          const footDistX = Math.abs(target.x - b.x);
          const footDistY = Math.abs(target.y - b.y);
          if (footDistX < 28 && footDistY < 26) {
            triggerSlip(target, b);
            bananaPeels.splice(i, 1);
            continue;
          }
        }
      }
    }

    // Energy Orbs (Panel 3)
    for (let i = energyOrbs.length - 1; i >= 0; i--) {
      const o = energyOrbs[i];
      o.life -= dt;
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      o.rot += dt * 7;

      // Trail sparkles
      if (Math.random() < 0.45) {
        particles.push({
          x: o.x - Math.sign(o.vx) * 14 + (Math.random() - 0.5) * 12,
          y: o.y + (Math.random() - 0.5) * 16,
          vx: -o.vx * 0.12 + (Math.random() - 0.5) * 30,
          vy: (Math.random() - 0.5) * 30,
          life: 0.22,
          maxLife: 0.22,
          size: Math.random() < 0.45 ? 5 : 2.2,
          style: Math.random() < 0.45 ? 'diamond' : 'dot',
          rot: 0
        });
      }

      if (o.life <= 0 || o.x < 10 || o.x > W - 10) {
        energyOrbs.splice(i, 1);
        continue;
      }

      // Clash with opposing orb
      let clashed = false;
      for (let j = i - 1; j >= 0; j--) {
        const o2 = energyOrbs[j];
        if (o2.owner !== o.owner && Math.hypot(o.x - o2.x, o.y - o2.y) < o.r + o2.r + 4) {
          spawnSparkles((o.x + o2.x) * 0.5, (o.y + o2.y) * 0.5, 14, 'diamond');
          SFX.block();
          energyOrbs.splice(i, 1);
          energyOrbs.splice(j, 1);
          i--;
          clashed = true;
          break;
        }
      }
      if (clashed) continue;

      // Hit fighter
      const target = fighters[1 - o.owner];
      const attacker = fighters[o.owner];
      if (target && Math.abs(target.x - o.x) < 30 && Math.abs((target.y - 50) - o.y) < 48) {
        // Shield parry! If shielded right as orb arrives (<0.22s), reflect it!
        if (target.state === 'shield' && target.shieldTime < 0.24) {
          o.owner = target.id;
          o.vx = -o.vx * 1.15;
          o.life = 2.0;
          spawnSparkles(o.x, o.y, 10, 'diamond');
          spawnCallout('反弹!', target.x, target.y - 120, target.x, target.y - 82, 0.7);
          SFX.block();
          hitstop = 0.05;
        } else {
          damageFighter(attacker, target, 12, Math.sign(o.vx) * 200, -135, true);
          energyOrbs.splice(i, 1);
        }
      }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += dt * 4;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Callouts
    for (let i = callouts.length - 1; i >= 0; i--) {
      const c = callouts[i];
      c.life -= dt;
      c.y -= 10 * dt;
      if (c.life <= 0) callouts.splice(i, 1);
    }
  }

  // =========================================================
  // 10. Stickman Renderer (Faithful to the Hand-Drawn Comic!)
  // =========================================================
  function drawBroadSword(hx, hy, angle, scale = 1, slim = false, seed = 40) {
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(angle);
    ctx.scale(scale, scale);

    if (slim) {
      // Slim dark marker sword from Panel 1
      sketchLine(0, 6, 0, -42, 4.8, '#1e1c1a', seed + 1, 0.8);
      sketchLine(-9, -4, 9, -4, 3.6, '#1e1c1a', seed + 2, 0.6);
    } else {
      // Chunky hand-drawn broadsword from Panels 3, 4, 5, 6!
      ctx.fillStyle = '#f6f2e8';
      ctx.strokeStyle = '#1e1c1a';
      ctx.lineWidth = 2.8;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(-6, -6);
      ctx.lineTo(-4 + jitter(seed + 1, 0.7), -54);
      ctx.lineTo(1, -66);
      ctx.lineTo(6 + jitter(seed + 2, 0.7), -54);
      ctx.lineTo(6, -6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Crossguard & grip
      ctx.fillStyle = '#1e1c1a';
      ctx.fillRect(-11, -8, 22, 6);
      sketchLine(0, -2, 0, 11, 5.2, '#1e1c1a', seed + 4, 0.4);
    }
    ctx.restore();
  }

  function drawFace(role, state, hx, hy, r, facing, seed) {
    ctx.save();
    ctx.strokeStyle = '#1e1c1a';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';

    if (state === 'slip' || state === 'hurt') {
      // Panel 2 shocked "o" mouth!
      sketchCircle(hx + facing * 3, hy + 2, 4.5, 2.2, '#1e1c1a', null, seed + 1, 0.4);
    } else if (state === 'ko') {
      // Knocked out face-down (Panel 6 has blank/dizzy head)
      sketchLine(hx - 4, hy - 2, hx + 4, hy + 2, 2, '#1e1c1a', seed + 1, 0.3);
      sketchLine(hx + 4, hy - 2, hx - 4, hy + 2, 2, '#1e1c1a', seed + 2, 0.3);
    } else if (state === 'walkoff') {
      // Panel 6 calm serious frown when leaving ("走了")
      ctx.beginPath();
      ctx.arc(hx + facing * 3, hy + 8, 5, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
    } else if (role === 'angry') {
      // Panels 3, 4, 5 signature forehead anger vein mark (💢)
      const vx = hx - facing * 3;
      const vy = hy - 3;
      const s = 4.2;
      ctx.beginPath();
      ctx.moveTo(vx - s, vy - 1.5); ctx.quadraticCurveTo(vx - 1.5, vy - 1.5, vx - 1.5, vy - s);
      ctx.moveTo(vx + s, vy - 1.5); ctx.quadraticCurveTo(vx + 1.5, vy - 1.5, vx + 1.5, vy - s);
      ctx.moveTo(vx - s, vy + 1.5); ctx.quadraticCurveTo(vx - 1.5, vy + 1.5, vx - 1.5, vy + s);
      ctx.moveTo(vx + s, vy + 1.5); ctx.quadraticCurveTo(vx + 1.5, vy + 1.5, vx + 1.5, vy + s);
      ctx.stroke();
    } else {
      // Panels 1, 2, 5 cute "ε" / "3" face!
      ctx.beginPath();
      const fx = hx + facing * 2;
      ctx.arc(fx, hy - 3, 3.2, -Math.PI * 0.65, Math.PI * 0.55);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(fx, hy + 3, 3.2, -Math.PI * 0.55, Math.PI * 0.65);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFighter(f) {
    const s = boilSeed(500 + f.id * 97);
    const dir = f.facing;

    // Ground shadow
    const heightAboveGround = Math.max(0, GROUND_Y - f.y);
    const shadowScale = Math.max(0.35, 1 - heightAboveGround / 380);
    ctx.save();
    ctx.fillStyle = 'rgba(30,28,26,0.12)';
    ctx.beginPath();
    ctx.ellipse(f.x, GROUND_Y + 3, 24 * shadowScale, 5.5 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(f.x, f.y);

    // KO flat on the ground (exact Panel 6 pose!)
    if (f.state === 'ko') {
      // Skid marks ///
      for (let i = 0; i < 3; i++) {
        sketchLine(-dir * (38 + i * 11), -22 - i * 4, -dir * (18 + i * 11), -8 - i * 4, 2.2, '#1e1c1a', s + 80 + i, 0.7);
      }
      // Lying flat
      const headX = dir * 24;
      const hipX = -dir * 18;
      sketchLine(hipX, -9, headX - dir * 13, -12, 3.2, '#1e1c1a', s + 1, 0.9);
      sketchLine(hipX, -9, hipX - dir * 20, -3, 3.0, '#1e1c1a', s + 2, 0.9);
      sketchLine(hipX, -9, hipX - dir * 14, -19, 3.0, '#1e1c1a', s + 3, 0.9);
      sketchLine(headX - dir * 16, -12, headX - dir * 5, -2, 2.8, '#1e1c1a', s + 4, 0.9);
      sketchCircle(headX, -14, 14, 3.0, '#1e1c1a', '#f6f2e8', s + 5, 0.9);
      drawFace(f.role, 'ko', headX, -14, 14, dir, s + 10);
      ctx.restore();
      return;
    }

    // Slip rotation (Panel 2 upside-down banana slip!)
    if (f.state === 'slip') {
      ctx.translate(0, -48);
      ctx.rotate(f.slipRot);
      ctx.translate(0, 48);
    }

    // Procedural joint positions
    const bob = f.state === 'idle' ? Math.sin(globalTime * 5 + f.id * 2) * 2.5
      : f.state === 'fly' ? Math.sin(globalTime * 7 + f.id) * 5.5
      : f.state === 'run' ? Math.abs(Math.sin(f.walkPhase)) * -4 : 0;

    const crouch = f.state === 'shield' ? 11 : 0;
    const hipX = 0;
    const hipY = -34 + bob + crouch;
    const neckX = (f.state === 'run' ? dir * 6 : f.state === 'slash' ? dir * 8 : 0);
    const neckY = -68 + bob + crouch;
    const headX = neckX;
    const headY = neckY - 16;

    // Legs
    let lFootX = -13, lFootY = 0, rFootX = 13, rFootY = 0;
    if (f.state === 'run' || f.state === 'walkoff') {
      const sw = Math.sin(f.walkPhase);
      lFootX = sw * 19;
      lFootY = Math.min(0, -Math.cos(f.walkPhase) * 9);
      rFootX = -sw * 19;
      rFootY = Math.min(0, Math.cos(f.walkPhase) * 9);
    } else if (!f.onGround) {
      lFootX = -11 - dir * 4;
      lFootY = -6 + bob * 0.5;
      rFootX = 11 - dir * 2;
      rFootY = -12 + bob * 0.5;
    } else if (f.state === 'shield') {
      lFootX = -18; rFootX = 18;
    } else if (f.state === 'slash') {
      lFootX = -16 * dir; rFootX = 20 * dir;
    }

    // Arms & sword
    let backHandX = neckX - dir * 24;
    let backHandY = neckY + 14;
    let frontHandX = neckX + dir * 24;
    let frontHandY = neckY + 12;
    let swordAngle = dir * 0.25;
    let swordOnFront = true;

    if (f.state === 'idle') {
      frontHandX = neckX + dir * 22;
      frontHandY = neckY + 14;
      backHandX = neckX - dir * 22;
      backHandY = neckY + 16;
      swordAngle = dir * 0.18 + Math.sin(globalTime * 4) * 0.06;
    } else if (f.state === 'run') {
      const sw = Math.sin(f.walkPhase);
      frontHandX = neckX + dir * 22;
      frontHandY = neckY + 10 + sw * 6;
      backHandX = neckX - dir * 20;
      backHandY = neckY + 14 - sw * 6;
      swordAngle = dir * 0.55;
    } else if (f.state === 'fly') {
      frontHandX = neckX + dir * 22;
      frontHandY = neckY + 10;
      backHandX = neckX - dir * 24;
      backHandY = neckY + 6;
      swordAngle = dir * -0.22;
    } else if (f.state === 'slash') {
      const t = 1 - f.stateTimer / 0.28; // 0..1
      if (t < 0.28) {
        // Wind-up back
        frontHandX = neckX - dir * 10;
        frontHandY = neckY - 14;
        swordAngle = -dir * 1.1;
      } else {
        // Big sweeping slash!
        const st = Math.min(1, (t - 0.28) / 0.45);
        const arc = -1.1 + st * 2.75;
        frontHandX = neckX + dir * (28 + Math.sin(st * Math.PI) * 14);
        frontHandY = neckY + 8 + st * 12;
        swordAngle = dir * arc;
      }
      backHandX = neckX - dir * 24;
      backHandY = neckY + 16;
    } else if (f.state === 'orb') {
      // Panel 3 exact pose: sword held up in back hand, front arm outstretched shooting energy!
      swordOnFront = false;
      backHandX = neckX - dir * 22;
      backHandY = neckY + 4;
      swordAngle = -dir * 0.12;
      frontHandX = neckX + dir * 32;
      frontHandY = neckY + 2;
    } else if (f.state === 'throw') {
      // Panel 1 exact pose: sword in back hand, front arm tossing banana peel!
      swordOnFront = false;
      backHandX = neckX - dir * 18;
      backHandY = neckY + 14;
      swordAngle = -dir * 0.15;
      frontHandX = neckX + dir * 28;
      frontHandY = neckY - 4;
    } else if (f.state === 'shield') {
      // Panel 4 pose: sword ready low, crouching behind giant circular hand-drawn barrier!
      frontHandX = neckX + dir * 18;
      frontHandY = neckY + 14;
      backHandX = neckX - dir * 14;
      backHandY = neckY + 12;
      swordAngle = dir * 0.15;
    } else if (f.state === 'slip') {
      frontHandX = neckX + dir * 26;
      frontHandY = neckY - 14;
      backHandX = neckX - dir * 26;
      backHandY = neckY - 10;
      swordAngle = dir * 1.4;
    } else if (f.state === 'walkoff') {
      frontHandX = neckX + dir * 20;
      frontHandY = neckY + 18;
      backHandX = neckX - dir * 16;
      backHandY = neckY + 20;
      swordAngle = dir * 0.72;
    }

    // Panel 4 Hand-Drawn Round Shield / Barrier Arc
    if (f.state === 'shield') {
      ctx.save();
      ctx.strokeStyle = '#1e1c1a';
      ctx.fillStyle = 'rgba(255, 252, 240, 0.45)';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.arc(neckX + dir * 4, neckY + 16, 46, -Math.PI * 0.75, Math.PI * 0.75);
      ctx.stroke();
      // Secondary inner hand-sketched shield curve matching Panel 4
      sketchCircle(neckX + dir * 2, neckY + 16, 42, 2.4, 'rgba(30,28,26,0.72)', 'rgba(235, 245, 232, 0.35)', s + 60, 2.2);
      ctx.restore();
    }

    // Panel 2 Slip motion lines
    if (f.state === 'slip') {
      sketchLine(-24, -10, -34, -42, 2.0, '#1e1c1a', s + 70, 1.0);
      sketchLine(-14, -8, -22, -38, 2.0, '#1e1c1a', s + 71, 1.0);
    }

    // Slash ink trail
    if (f.state === 'slash' && f.stateTimer < 0.21 && f.stateTimer > 0.04) {
      ctx.save();
      ctx.strokeStyle = '#1e1c1a';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      if (dir > 0) ctx.arc(neckX + 10, neckY + 6, 62, -1.15, 0.85);
      else ctx.arc(neckX - 10, neckY + 6, 62, Math.PI - 0.85, Math.PI + 1.15);
      ctx.stroke();
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      if (dir > 0) ctx.arc(neckX + 10, neckY + 6, 70, -0.95, 0.65);
      else ctx.arc(neckX - 10, neckY + 6, 70, Math.PI - 0.65, Math.PI + 0.95);
      ctx.stroke();
      ctx.restore();
    }

    // Draw torso & limbs
    const strokeCol = (f.state === 'hurt' && Math.floor(globalTime * 24) % 2 === 0) ? '#b83c2c' : '#1e1c1a';
    const armWidth = (f.role === 'ren' && f.state === 'idle') ? 3.8 : 3.2;

    // Legs
    sketchLine(hipX, hipY, lFootX, lFootY, 3.2, strokeCol, s + 1, 1.0);
    sketchLine(hipX, hipY, rFootX, rFootY, 3.2, strokeCol, s + 2, 1.0);
    // Torso
    sketchLine(hipX, hipY, neckX, neckY, 3.4, strokeCol, s + 3, 1.0);
    // Arms
    sketchLine(neckX, neckY + 6, backHandX, backHandY, armWidth, strokeCol, s + 4, 1.0);
    sketchLine(neckX, neckY + 6, frontHandX, frontHandY, armWidth, strokeCol, s + 5, 1.0);

    // Sword
    const swordX = swordOnFront ? frontHandX : backHandX;
    const swordY = swordOnFront ? frontHandY : backHandY;
    drawBroadSword(swordX, swordY, swordAngle, 1.0, f.role === 'ren', s + 20);

    // Head circle
    sketchCircle(headX, headY, 15.5, 3.1, strokeCol, '#f6f2e8', s + 10, 1.0);
    drawFace(f.role, f.state, headX, headY, 15.5, dir, s + 15);

    // Signature "人" mark above head for the 'ren' stickman (Panels 1, 2, 5!)
    if (f.role === 'ren') {
      ctx.save();
      ctx.font = 'bold 20px "Kaiti SC", "STKaiti", "PingFang SC", cursive';
      ctx.fillStyle = '#1e1c1a';
      ctx.textAlign = 'center';
      ctx.fillText('人', headX, headY - 22);
      ctx.restore();
    }

    // Floating air lines under feet when flying/hovering (Panel 5 "飞 / 飘")
    if (f.state === 'fly') {
      sketchLine(-14, 10, 14, 10, 1.8, 'rgba(30,28,26,0.55)', s + 44, 1.2);
      sketchLine(-9, 17, 9, 17, 1.5, 'rgba(30,28,26,0.40)', s + 45, 1.2);
    }

    // Small P1 / P2 indicator tag above head (only during gameplay, not story mode)
    if (!storyState.active) {
      const tagY = f.role === 'ren' ? headY - 46 : headY - 28;
      ctx.save();
      ctx.font = 'bold 12px "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = f.id === 0 ? '#c94a38' : '#2e6b8a';
      const label = f.id === 0 ? '1P' : (gameMode === '2p' ? '2P' : '电脑');
      ctx.fillText(label, headX, tagY);
      ctx.restore();
    }

    ctx.restore();
  }

  // =========================================================
  // 11. Props Renderer (Banana Peel, Sparkle Energy Orb, Particles)
  // =========================================================
  function drawBananaPeel(b, idx) {
    const s = boilSeed(900 + idx * 17);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    ctx.strokeStyle = '#1e1c1a';
    ctx.fillStyle = '#fae8a2';
    ctx.lineWidth = 2.4;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // Exact 3-petal comic banana peel from Panels 1 & 2!
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.quadraticCurveTo(-8, -4, -18, 4);
    ctx.quadraticCurveTo(-8, 6, -3, -2);
    ctx.quadraticCurveTo(0, 8, 2, 7);
    ctx.quadraticCurveTo(5, -1, 18, 4);
    ctx.quadraticCurveTo(10, -5, 2, -14);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Little stem at top
    sketchLine(0, -14, 1, -20, 2.6, '#1e1c1a', s, 0.5);
    ctx.restore();
  }

  function drawEnergyOrb(o, idx) {
    const s = boilSeed(1100 + idx * 23);
    ctx.save();
    ctx.translate(o.x, o.y);

    // Outer & inner hand-drawn swirling orb (Panel 3!)
    sketchCircle(0, 0, o.r, 2.8, '#1e1c1a', '#fffef7', s, 1.3);
    ctx.save();
    ctx.rotate(o.rot);
    ctx.strokeStyle = '#1e1c1a';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(0, 0, o.r * 0.55, 0.2, Math.PI * 1.45);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, o.r * 0.25, Math.PI, Math.PI * 2.2);
    ctx.stroke();
    ctx.restore();

    // Orbiting diamond sparkles ◇ like Panel 3
    for (let k = 0; k < 3; k++) {
      const a = o.rot * 1.3 + (k * Math.PI * 2) / 3;
      const dx = Math.cos(a) * (o.r + 12);
      const dy = Math.sin(a) * (o.r + 10);
      drawDiamond(dx, dy, 5.5);
    }
    ctx.restore();
  }

  function drawDiamond(x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = '#1e1c1a';
    ctx.fillStyle = '#fffdf5';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.lineTo(size * 0.72, 0);
    ctx.lineTo(0, size);
    ctx.lineTo(-size * 0.72, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      if (p.style === 'diamond') {
        drawDiamond(p.x, p.y, p.size);
      } else {
        ctx.fillStyle = '#1e1c1a';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawCallouts() {
    for (const c of callouts) {
      const alpha = Math.min(1, c.life / 0.35);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#1e1c1a';
      ctx.font = 'bold 28px "Kaiti SC", "STKaiti", "PingFang SC", cursive';
      ctx.textAlign = 'center';
      ctx.fillText(c.text, c.x, c.y);
      drawCurvedPointer(c.x, c.y + 8, c.targetX, c.targetY, Math.floor(c.x));
      ctx.restore();
    }
  }

  // =========================================================
  // 12. Hand-Drawn HUD (HP & Fly Energy Bars)
  // =========================================================
  function drawHUD() {
    if (storyState.active) return;

    const barW = 290;
    const barH = 18;
    const topY = 40;

    fighters.forEach((f, idx) => {
      const isLeft = idx === 0;
      const bx = isLeft ? 42 : W - 42 - barW;
      const s = boilSeed(1400 + idx * 31);

      ctx.save();
      // Name + role label
      ctx.fillStyle = '#1e1c1a';
      ctx.font = 'bold 16px "PingFang SC", sans-serif';
      ctx.textAlign = isLeft ? 'left' : 'right';
      const who = isLeft ? `1P · ${f.name}` : `${gameMode === '2p' ? '2P' : '电脑'} · ${f.name}`;
      ctx.fillText(who, isLeft ? bx : bx + barW, topY - 6);

      // HP Bar background
      ctx.fillStyle = '#fffdf8';
      ctx.fillRect(bx, topY, barW, barH);

      // HP Fill
      const hpRatio = Math.max(0, f.hp / f.maxHp);
      const fillW = barW * hpRatio;
      ctx.fillStyle = hpRatio > 0.45 ? (isLeft ? '#c94a38' : '#2e6b8a') : '#d98a2b';
      if (isLeft) ctx.fillRect(bx, topY, fillW, barH);
      else ctx.fillRect(bx + (barW - fillW), topY, fillW, barH);

      // Hand-drawn ink border around HP bar
      sketchLine(bx, topY, bx + barW, topY, 2.4, '#1e1c1a', s + 1, 0.8);
      sketchLine(bx + barW, topY, bx + barW, topY + barH, 2.4, '#1e1c1a', s + 2, 0.8);
      sketchLine(bx + barW, topY + barH, bx, topY + barH, 2.4, '#1e1c1a', s + 3, 0.8);
      sketchLine(bx, topY + barH, bx, topY, 2.4, '#1e1c1a', s + 4, 0.8);

      // Fly / Hover Stamina Bar ("飞/飘")
      const fy = topY + barH + 7;
      const fw = 155;
      const fh = 7;
      const fx = isLeft ? bx : bx + barW - fw;
      ctx.fillStyle = 'rgba(30,28,26,0.12)';
      ctx.fillRect(fx, fy, fw, fh);
      ctx.fillStyle = '#5c4b8a';
      const flyW = fw * (f.flyEnergy / f.maxFlyEnergy);
      if (isLeft) ctx.fillRect(fx, fy, flyW, fh);
      else ctx.fillRect(fx + (fw - flyW), fy, flyW, fh);
      ctx.strokeStyle = '#1e1c1a';
      ctx.lineWidth = 1.4;
      ctx.strokeRect(fx, fy, fw, fh);

      ctx.font = 'bold 11px "PingFang SC", sans-serif';
      ctx.fillStyle = '#4e4942';
      ctx.textAlign = isLeft ? 'left' : 'right';
      ctx.fillText('飞/飘气力', isLeft ? fx + fw + 6 : fx - 6, fy + 7);
      ctx.restore();
    });

    // Center VS badge
    ctx.save();
    ctx.font = '900 22px "Kaiti SC", "PingFang SC", serif';
    ctx.fillStyle = '#1e1c1a';
    ctx.textAlign = 'center';
    ctx.fillText('VS', W * 0.5, topY + 15);
    ctx.restore();

    // KO Banner
    if (matchState === 'ko' && koTimer > 0.6) {
      ctx.save();
      const boxW = 436, boxH = 104;
      const rx = (W - boxW) * 0.5, ry = 128;
      ctx.fillStyle = 'rgba(246, 242, 232, 0.95)';
      ctx.fillRect(rx, ry, boxW, boxH);
      sketchLine(rx, ry, rx + boxW, ry, 3, '#1e1c1a', 81, 1.3);
      sketchLine(rx + boxW, ry, rx + boxW, ry + boxH, 3, '#1e1c1a', 82, 1.3);
      sketchLine(rx + boxW, ry + boxH, rx, ry + boxH, 3, '#1e1c1a', 83, 1.3);
      sketchLine(rx, ry + boxH, rx, ry, 3, '#1e1c1a', 84, 1.3);

      const winner = fighters[winnerId];
      const winLabel = winnerId === 0 ? '1P 胜出！' : (gameMode === '2p' ? '2P 胜出！' : '电脑胜出！');
      ctx.fillStyle = '#1e1c1a';
      ctx.font = '900 24px "Kaiti SC", "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${winLabel}（${winner.name}）`, W * 0.5, ry + 48);

      ctx.font = 'bold 14px "PingFang SC", sans-serif';
      ctx.fillStyle = '#4e4942';
      ctx.fillText('按 R 键或点击右上角「重来」再打一局', W * 0.5, ry + 80);
      ctx.restore();
    }
  }

  // =========================================================
  // 13. 6-Panel Original Comic Animated Replay Mode!
  // =========================================================
  const storyState = {
    active: false,
    t: 0,
    panel: 1,
    triggered: {}
  };

  const STORY_CAPTIONS = {
    1: '第 1 格：大太阳下，「人」字小人偷偷丢出一块香蕉皮……',
    2: '第 2 格：啊呀！对面小人踩中香蕉皮，四脚朝天滑飞了！',
    3: '第 3 格：怒气大剑客暴怒（💢），放出菱形星光能量波！',
    4: '第 4 格：举剑撑起手绘大圆盾，严阵以待！',
    5: '第 5 格：夜幕弯月升起！怒气剑客在「天」上飞、飘，俯视「地」上的人！',
    6: '第 6 格：胜负已分，对手倒地，剑客潇洒「走了」！'
  };

  function startStoryReplay() {
    storyState.active = true;
    storyState.t = 0;
    storyState.panel = 1;
    storyState.triggered = {};
    bananaPeels.length = 0;
    energyOrbs.length = 0;
    particles.length = 0;
    callouts.length = 0;
    matchState = 'fighting';
    fighters = [
      createFighter(0, 'ren', 260, 1),
      createFighter(1, 'angry', 590, -1)
    ];
    storyCaption.classList.add('visible');
    storyCaption.textContent = STORY_CAPTIONS[1];
    document.getElementById('btnStory').classList.add('active');
    document.getElementById('btnStory').textContent = '⏹ 结束演示';
  }

  function stopStoryReplay() {
    storyState.active = false;
    storyCaption.classList.remove('visible');
    document.getElementById('btnStory').classList.remove('active');
    document.getElementById('btnStory').textContent = '▶ 播原画六格';
    resetMatch();
  }

  function updateStoryReplay(dt) {
    storyState.t += dt;
    const t = storyState.t;
    const ren = fighters[0];
    const angry = fighters[1];

    const once = (key, fn) => {
      if (!storyState.triggered[key]) {
        storyState.triggered[key] = true;
        fn();
      }
    };

    if (t < 2.1) {
      storyState.panel = 1;
      storyCaption.textContent = STORY_CAPTIONS[1];
      once('p1', () => {
        ren.x = 260; ren.y = GROUND_Y; ren.facing = 1;
        angry.x = 610; angry.y = GROUND_Y; angry.facing = -1;
        angry.role = 'ren'; // calm before getting angry in panel 3!
      });
      if (t > 0.65) {
        once('p1_banana', () => {
          ren.cooldowns.banana = 0;
          startBanana(ren);
        });
      }
      if (t > 1.25) {
        angry.x -= 130 * dt;
        angry.state = 'run';
        angry.walkPhase += dt * 10;
      }
    } else if (t < 4.3) {
      storyState.panel = 2;
      storyCaption.textContent = STORY_CAPTIONS[2];
      once('p2_slip', () => {
        angry.role = 'ren';
        triggerSlip(angry, { x: angry.x - 10 });
      });
    } else if (t < 6.8) {
      storyState.panel = 3;
      storyCaption.textContent = STORY_CAPTIONS[3];
      once('p3_orb', () => {
        bananaPeels.length = 0;
        angry.role = 'angry';
        angry.state = 'idle';
        angry.x = 380; angry.y = GROUND_Y; angry.vx = 0; angry.vy = 0; angry.facing = 1;
        ren.x = 740; ren.y = GROUND_Y; ren.facing = -1;
        angry.cooldowns.orb = 0;
        startOrb(angry);
      });
    } else if (t < 8.8) {
      storyState.panel = 4;
      storyCaption.textContent = STORY_CAPTIONS[4];
      angry.state = 'shield';
      angry.facing = -1;
      angry.x = 460;
      angry.y = GROUND_Y;
    } else if (t < 11.8) {
      storyState.panel = 5;
      storyCaption.textContent = STORY_CAPTIONS[5];
      once('p5_fly', () => {
        ren.x = 300; ren.y = GROUND_Y; ren.facing = 1; ren.state = 'idle';
        angry.x = 560; angry.y = 310; angry.facing = -1; angry.state = 'fly';
        spawnCallout('飞', 490, 178, 545, 225, 2.8);
        spawnCallout('飘', 640, 228, 580, 232, 2.8);
      });
      angry.y = 305 + Math.sin(t * 4) * 14;
      angry.x = 560 + Math.cos(t * 2) * 26;
      angry.state = 'fly';
    } else if (t < 14.8) {
      storyState.panel = 6;
      storyCaption.textContent = STORY_CAPTIONS[6];
      once('p6_ko', () => {
        ren.x = 340; ren.y = GROUND_Y; ren.facing = -1; ren.state = 'ko';
        angry.x = 540; angry.y = GROUND_Y; angry.facing = 1; angry.state = 'walkoff';
        spawnCallout('走了', 510, 305, 540, 345, 2.9);
        SFX.ko();
      });
      angry.x += 70 * dt;
      angry.walkPhase += dt * 7;
    } else {
      stopStoryReplay();
      return;
    }

    // Minimal physics for slip & projectiles during replay
    if (angry.state === 'slip') {
      angry.vy += 1200 * dt;
      angry.x += angry.vx * dt;
      angry.y = Math.min(GROUND_Y, angry.y + angry.vy * dt);
      angry.slipRot += dt * 11;
    }
    updateProjectiles(dt);
  }

  // =========================================================
  // 14. Main Loop
  // =========================================================
  let lastTime = performance.now();

  function frame(now) {
    const rawDt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    globalTime += rawDt;

    pollGamepads();

    // Smooth day/night transition
    const targetNight = isCurrentlyNight() ? 1 : 0;
    skyNightFactor += (targetNight - skyNightFactor) * Math.min(1, rawDt * 3.5);

    if (shakeTime > 0) shakeTime = Math.max(0, shakeTime - rawDt);

    if (hitstop > 0) {
      hitstop = Math.max(0, hitstop - rawDt);
    } else if (storyState.active) {
      updateStoryReplay(rawDt);
    } else {
      if (matchState === 'ko') koTimer += rawDt;

      const inp0 = readHumanInput(0);
      const inp1 = gameMode === '2p' ? readHumanInput(1) : computeAIInput(fighters[1], fighters[0], rawDt);

      updateFighter(fighters[0], fighters[1], inp0, rawDt);
      updateFighter(fighters[1], fighters[0], inp1, rawDt);

      // Prevent fighters from completely overlapping
      if (matchState === 'fighting') {
        const dx = fighters[1].x - fighters[0].x;
        const dy = Math.abs(fighters[1].y - fighters[0].y);
        if (Math.abs(dx) < 34 && dy < 70) {
          const push = (34 - Math.abs(dx)) * 0.5;
          const dir = dx >= 0 ? 1 : -1;
          fighters[0].x = Math.max(STAGE_LEFT, fighters[0].x - dir * push);
          fighters[1].x = Math.min(STAGE_RIGHT, fighters[1].x + dir * push);
        }
      }

      updateProjectiles(rawDt);
    }

    justPressed.clear();
    touchJustPressed.clear();

    // Render scene
    ctx.save();
    if (shakeTime > 0) {
      const sx = (Math.random() - 0.5) * 2 * shakeAmp;
      const sy = (Math.random() - 0.5) * 2 * shakeAmp;
      ctx.translate(sx, sy);
    }

    drawStage();
    bananaPeels.forEach(drawBananaPeel);
    fighters.forEach(drawFighter);
    energyOrbs.forEach(drawEnergyOrb);
    drawParticles();
    drawCallouts();
    drawHUD();

    // Story panel number stamp at top-left like the original hand-drawn comic (1..6)
    if (storyState.active) {
      ctx.save();
      ctx.font = 'bold 34px "Kaiti SC", "Comic Sans MS", cursive';
      ctx.fillStyle = '#1e1c1a';
      ctx.fillText(String(storyState.panel), 36, 56);
      ctx.restore();
    }

    ctx.restore();
    requestAnimationFrame(frame);
  }

  // =========================================================
  // 15. UI Controls Wiring
  // =========================================================
  const btnMode1P = document.getElementById('btnMode1P');
  const btnMode2P = document.getElementById('btnMode2P');
  const btnDiff = document.getElementById('btnDiff');
  const btnSwap = document.getElementById('btnSwap');
  const btnTime = document.getElementById('btnTime');
  const btnStory = document.getElementById('btnStory');
  const btnSound = document.getElementById('btnSound');
  const btnRestart = document.getElementById('btnRestart');
  const p2Guide = document.getElementById('p2Guide');

  btnMode1P.addEventListener('click', () => {
    ensureAudio();
    if (storyState.active) stopStoryReplay();
    gameMode = '1p';
    btnMode1P.classList.add('active');
    btnMode2P.classList.remove('active');
    btnDiff.style.display = '';
    p2Guide.style.display = 'none';
    resetMatch();
  });

  function setMode2P() {
    if (storyState.active) stopStoryReplay();
    gameMode = '2p';
    btnMode2P.classList.add('active');
    btnMode1P.classList.remove('active');
    btnDiff.style.display = 'none';
    p2Guide.style.display = '';
    resetMatch();
  }

  btnMode2P.addEventListener('click', () => {
    ensureAudio();
    setMode2P();
  });

  const diffLabels = ['电脑：轻松', '电脑：普通', '电脑：高手'];
  btnDiff.addEventListener('click', () => {
    ensureAudio();
    aiDifficulty = (aiDifficulty + 1) % 3;
    btnDiff.textContent = diffLabels[aiDifficulty];
  });

  btnSwap.addEventListener('click', () => {
    ensureAudio();
    if (storyState.active) stopStoryReplay();
    swapped = !swapped;
    resetMatch();
  });

  const timeModes = [
    { id: 'auto', label: '☀ 自动日夜' },
    { id: 'day', label: '☀ 太阳' },
    { id: 'night', label: '🌙 月亮' }
  ];
  let timeIdx = 0;
  btnTime.textContent = timeModes[0].label;
  btnTime.addEventListener('click', () => {
    ensureAudio();
    timeIdx = (timeIdx + 1) % timeModes.length;
    timeMode = timeModes[timeIdx].id;
    btnTime.textContent = timeModes[timeIdx].label;
  });

  btnStory.addEventListener('click', () => {
    ensureAudio();
    if (storyState.active) stopStoryReplay();
    else startStoryReplay();
  });

  btnSound.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    btnSound.textContent = soundEnabled ? '🔊 音效开' : '🔇 音效关';
    if (soundEnabled) ensureAudio();
  });

  btnRestart.addEventListener('click', () => {
    ensureAudio();
    if (storyState.active) stopStoryReplay();
    else resetMatch();
  });

  // Boot!
  resetMatch();
  requestAnimationFrame(frame);
})();
</script>
</body>
